/* Layout: a printed menu card turned into one long phone column — colour band header that flips TR/EN like the printed menu, sticky section chips, then sections with the print's italic heading over a double rule. */
:root{
  --paper:#fdfdfa;
  --ink:#232120;
  --ink-soft:#4a4644;
  --aqua:#a5e0d7;
  --aqua-deep:#5fb7ab;
  --bordo:#70131a;
  --bordo-soft:#7a1f22;
  --rule:#232120;
  --dot:#b9b4ae;
  --f-slab:"Archer", "Archer Pro", Rockwell, "Roboto Slab", "Zilla Slab", Georgia, serif;
  color-scheme:light;
}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-slab);font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* cover band — aqua for Türkçe, bordo for English, like the two printed covers */
.cover{background:var(--aqua);color:var(--bordo);transition:background-color .35s ease,color .35s ease}
html[lang="en"] .cover{background:var(--bordo);color:var(--aqua)}
.cover .wrap{padding-block:18px 34px;display:grid;gap:30px}
.lang{justify-self:end;display:flex;border:1.5px solid currentColor;border-radius:999px;overflow:hidden}
.lang button{font:600 13px/1 var(--f-slab);letter-spacing:.08em;color:inherit;background:transparent;border:0;padding:8px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:currentColor}
.lang button[aria-pressed="true"] span{color:var(--aqua)}
html[lang="en"] .lang button[aria-pressed="true"] span{color:var(--bordo)}
.lang button:focus-visible{outline:2px solid currentColor;outline-offset:-5px}
.mark{margin:0;font-weight:400;font-size:clamp(54px,17vw,96px);line-height:.9;letter-spacing:-.02em;text-align:center}
.mark b{font-weight:700}
.where{margin:0;text-align:center;font-size:14px;letter-spacing:.02em;font-style:italic;opacity:.9}

/* section chips */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid #e7e3dc}
.nav .wrap{padding-left:0;padding-right:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px));scroll-padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-style:italic;font-weight:600;font-size:15px;padding:6px 12px;border-radius:999px;color:var(--ink-soft);white-space:nowrap}
.chips a.on{background:var(--aqua);color:var(--ink)}
html[lang="en"] .chips a.on{background:var(--bordo);color:var(--paper)}
.chips a:focus-visible{outline:2px solid var(--bordo);outline-offset:2px}
.chips .sep{flex:none;align-self:center;width:1px;height:18px;background:#d9d4cc;margin:0 4px}

/* menu */
main .wrap{padding-block:12px 40px}
.sec{padding-top:34px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 62px)}
.sec h2{margin:0;font-weight:700;font-style:italic;font-size:clamp(27px,7.4vw,34px);line-height:1.1;letter-spacing:-.005em;text-wrap:balance}
.sec h2 small{font-size:.5em;font-weight:400;letter-spacing:0;margin-left:.35em}
.sec .by{margin:4px 0 0;font-style:italic;font-size:13px;color:var(--ink-soft)}
.dbl{height:5px;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);margin:8px 0 18px}
.sub{margin:22px 0 8px;font-style:italic;font-weight:700;font-size:17px}
.sub:first-of-type{margin-top:4px}
.sub .chipnote{display:inline-block;font-weight:400;font-size:13px;margin-left:6px;color:var(--ink-soft)}
ul{list-style:none;margin:0;padding:0}
.food li{padding:12px 0}
.food li+li{border-top:1px dotted var(--dot)}
.nm{margin:0;font-weight:700;font-size:16.5px;line-height:1.25;letter-spacing:.035em;text-transform:uppercase;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ds{margin:4px 0 0;font-style:italic;font-size:15.5px;line-height:1.45;color:var(--ink-soft);max-width:60ch}
.ds .add{display:block;margin-top:4px;font-style:normal;font-size:13.5px;color:var(--bordo-soft)}
.drink li{padding:7px 0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;row-gap:1px}
.drink li+li{border-top:1px dotted var(--dot)}
.drink .dn{font-weight:600;font-size:16px;line-height:1.3}
.drink .dv{font-style:italic;font-size:14px;color:var(--ink-soft)}
.note{margin:16px 0 0;font-weight:600;font-size:14px;color:var(--ink-soft)}
.grp{margin:52px 0 0;display:flex;align-items:center;gap:12px;color:var(--bordo);font-style:italic;font-size:14px;letter-spacing:.04em}
.grp::before,.grp::after{content:"";flex:1;border-top:1px dotted var(--bordo)}

/* diet marks — drawn after the printed menu's aqua leaves */
.ic{display:inline-flex;width:20px;height:20px;color:var(--aqua-deep);flex:none}
.ic svg{width:100%;height:100%}
.ic.vg{width:28px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:22px 0 0;border-top:1px dotted var(--dot);font-style:italic;font-size:14px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}

footer{background:var(--bordo);color:var(--aqua)}
footer .wrap{padding-block:30px 36px;display:grid;gap:6px;text-align:center;font-size:14px}
footer .mark{font-size:40px;margin-bottom:8px}
footer a{text-decoration:none;border-bottom:1px solid currentColor}
footer p{margin:0}
@media (prefers-reduced-motion:reduce){.cover{transition:none}html{scroll-behavior:auto}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

 tr:{word:"menü",where:"Moda, Kadıköy",eat:"yemek",drink:"içecek",v:"vejetaryen",vg:"vegan",gf:"glütensiz",nav:"Bölümler"},
 en:{word:"menu",where:"Moda, Kadıköy · Istanbul",eat:"food",drink:"drinks",v:"vegetarian",vg:"vegan",gf:"gluten free",nav:"Sections"}
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function icon(k,L){
 var t=UI[L][k];
 if(k==="v")return '<span class="ic" role="img" aria-label="'+t+'" title="'+t+'"><svg><use href="#leaf"/></svg></span>';
 if(k==="vg")return '<span class="ic vg" role="img" aria-label="'+t+'" title="'+t+'"><svg viewBox="0 0 28 20"><use href="#leaf" width="18" height="18" y="2" transform="rotate(-18 9 11)"/><use href="#leaf" x="10" width="18" height="18" y="1"/></svg></span>';
 return '<span class="ic" role="img" aria-label="'+t+'" title="'+t+'"><svg><use href="#gf"/></svg></span>';
}
function render(L){
 var i=L==="tr"?0:1, h=[], chips=[];
 FOOD.forEach(function(s,si){
  chips.push('<a href="#s-'+s.id+'" data-s="s-'+s.id+'">'+esc(s[L])+'</a>');
  h.push('<section class="sec" id="s-'+s.id+'"><h2>'+esc(s[L])+'</h2><div class="dbl"></div><ul class="food">');
  s.items.forEach(function(it){
   var marks=(it[4]||"").split(" ").filter(Boolean).map(function(k){return icon(k,L)}).join("");
   var add=it[5]?'<span class="add">'+esc(it[5][i])+'</span>':"";
   h.push('<li><p class="nm">'+esc(it[i])+marks+'</p><p class="ds">'+esc(it[2+i])+add+'</p></li>');
  });
  h.push('</ul>'+(s.note?'<p class="note">('+esc(s.note[i])+')</p>':'')+'</section>');
 });
 h.push('<p class="legend">'+["v","vg","gf"].map(function(k){return '<span>'+icon(k,L)+UI[L][k]+'</span>'}).join("")+'</p>');
 h.push('<p class="grp">'+UI[L].drink+'</p>');
 chips.push('<span class="sep" aria-hidden="true"></span>');
 DRINK.forEach(function(s){
  chips.push('<a href="#s-'+s.id+'" data-s="s-'+s.id+'">'+esc(s[L])+'</a>');
  h.push('<section class="sec" id="s-'+s.id+'"><h2>'+esc(s[L])+(s.unit?'<small>'+s.unit+'</small>':'')+'</h2>'+(s.by?'<p class="by">'+esc(s.by[i])+'</p>':'')+'<div class="dbl"></div>');
  s.subs.forEach(function(sub){
   if(sub.tr)h.push('<p class="sub">'+esc(sub[L])+(sub.unit?'<span class="chipnote">'+sub.unit+'</span>':'')+'</p>');
   h.push('<ul class="drink">');
   sub.items.forEach(function(d){
    var n=d[i]||d[0], v=d[2+i]||d[2];
    h.push('<li><span class="dn">'+esc(n)+'</span>'+(v?'<span class="dv">'+esc(v)+'</span>':'')+'</li>');
   });
   h.push('</ul>');
  });
  h.push('</section>');
 });
 document.getElementById("menu").innerHTML=h.join("");
 document.getElementById("chips").innerHTML=chips.join("");
 document.getElementById("mword").textContent=UI[L].word;
 document.getElementById("where").textContent=UI[L].where;
 document.querySelector(".nav").setAttribute("aria-label",UI[L].nav);
 document.documentElement.lang=L;
 document.title=L==="tr"?"Yer Menü":"Yer Menu";
 ["tr","en"].forEach(function(x){document.getElementById("b-"+x).setAttribute("aria-pressed",x===L?"true":"false")});
 watch();
}
var obs;
function watch(){
 if(obs)obs.disconnect();
 if(!("IntersectionObserver" in window))return;
 obs=new IntersectionObserver(function(es){
  es.forEach(function(e){
   if(!e.isIntersecting)return;
   var id=e.target.id;
   document.querySelectorAll("#chips a").forEach(function(a){
    var on=a.getAttribute("data-s")===id; a.classList.toggle("on",on);
    if(on){var c=document.getElementById("chips");var l=a.offsetLeft-c.offsetWidth/2+a.offsetWidth/2;c.scrollTo({left:l,behavior:"smooth"})}
   });
  });
 },{rootMargin:"-70px 0px -70% 0px"});
 document.querySelectorAll(".sec").forEach(function(s){obs.observe(s)});
}
document.getElementById("chips").addEventListener("click",function(e){
 var a=e.target.closest("a"); if(!a)return; e.preventDefault();
 var t=document.getElementById(a.getAttribute("data-s")); if(t)t.scrollIntoView({block:"start"});
});
function pick(){return (location.hash||"").toLowerCase()==="#en"?"en":"tr"}
document.querySelectorAll(".lang button").forEach(function(b){
 b.addEventListener("click",function(){
  var L=b.getAttribute("data-l");
  if(pick()!==L){ try{history.replaceState(null,"",L==="en"?"#en":location.pathname+location.search)}catch(e){location.hash=L==="en"?"en":""} }
  render(L); window.scrollTo(0,0);
 });
});
window.addEventListener("hashchange",function(){var h=(location.hash||"").toLowerCase();if(h==="#en"||h===""||h==="#tr")render(pick())});
render(pick());
})();
